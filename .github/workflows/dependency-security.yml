name: Dependency security

on:
  pull_request:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade the installer
        run: python -m pip install --upgrade pip

      - name: Install every dependency group
        run: python -m pip install ".[dev,docs,openai,security,test]"

      - name: Remove the local project distribution
        run: python -m pip uninstall --yes proof-goblin

      - name: Audit installed dependencies
        run: >-
          python -m pip_audit --local --strict --progress-spinner off
