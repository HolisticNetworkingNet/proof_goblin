name: Dependency security

on:
  pull_request:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel

      - name: Install every dependency group
        run: python -m pip install ".[dev,docs,openai,security,test]"

      - name: Remove the local project distribution
        run: python -m pip uninstall --yes proof-goblin

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed dependencies
        run: >-
          python -m pip_audit --local --strict --progress-spinner off
