name: Dependency security

on:
  pull_request:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel

      - name: Install every dependency group
        run: python -m pip install ".[dev,docs,openai,security,test]"

      - name: Remove the local project distribution
        run: python -m pip uninstall --yes proof-goblin

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed dependencies
        run: >-
          python -m pip_audit --local --strict --progress-spinner off
