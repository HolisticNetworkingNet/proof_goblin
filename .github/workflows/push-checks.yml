name: Push checks

on:
  push:

permissions:
  contents: read

concurrency:
  group: push-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  error-checks:
    name: Ruff and pytest error checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install error-check dependencies
        run: python -m pip install -e ".[dev,test]"

      - name: Run Ruff error checks
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q -W error
