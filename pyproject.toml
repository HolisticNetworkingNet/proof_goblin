[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-goblin"
version = "0.1.0"
description = "A configurable AI review engine built around reusable proof lenses."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
proof-goblin = "proof_goblin.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.12",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]
openai = [
    "openai>=2.0",
]
test = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["proof_goblin*"]

[tool.setuptools.package-data]
proof_goblin = ["configs/*.pgcfg", "schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["proof_goblin/docs/_build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
