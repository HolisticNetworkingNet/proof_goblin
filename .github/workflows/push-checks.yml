name: Push checks

on:
  push:

permissions:
  contents: read

concurrency:
  group: push-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  error-checks:
    name: Ruff and pytest error checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install error-check dependencies
        run: python -m pip install -e ".[dev,test]"

      - name: Run Ruff error checks
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q -W error
