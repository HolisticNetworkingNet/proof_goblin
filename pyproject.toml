[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-goblin"
version = "0.1.0"
description = "A configurable AI review engine built around reusable proof lenses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Belknap" },
]
keywords = [
    "ai",
    "document-review",
    "prompt-engineering",
    "quality-assurance",
    "writing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]
dependencies = [
    "jsonschema>=4.23",
]

[project.urls]
Documentation = "https://github.com/HolisticNetworkingNet/proof_goblin/tree/main/proof_goblin/docs"
Issues = "https://github.com/HolisticNetworkingNet/proof_goblin/issues"
"Release notes" = "https://github.com/HolisticNetworkingNet/proof_goblin/releases"
Source = "https://github.com/HolisticNetworkingNet/proof_goblin"

[project.scripts]
proof-goblin = "proof_goblin.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "ruff==0.15.22",
    "twine>=6.1",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]
openai = [
    "openai>=2.0",
]
security = [
    "pip-audit>=2.10.1",
]
test = [
    "pytest>=8.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["proof_goblin*"]
namespaces = false

[tool.setuptools.package-data]
proof_goblin = ["configs/*.pgcfg", "schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["proof_goblin/docs/_build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
