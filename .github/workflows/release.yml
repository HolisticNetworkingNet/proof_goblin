name: Publish distributions

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify the protected release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/validate_release_ref.py
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --release-tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"

      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install ".[dev,docs,openai,security,test]"

      - name: Run source quality and behavior checks
        run: |
          python -m pip check
          ruff check .
          ruff format --check .
          python -m pytest -q -W error
          python -m sphinx -W --keep-going -b html proof_goblin/docs documentation-html

      - name: Audit release dependencies
        run: |
          python -m pip uninstall --yes proof-goblin
          python -m pip_audit --local --strict --progress-spinner off

      - name: Build the release artifacts once
        run: python -m build --outdir release-dist

      - name: Validate metadata and artifact contents
        run: |
          python -m twine check --strict release-dist/*
          python scripts/validate_distribution.py release-dist

      - name: Validate clean artifact installations
        run: python scripts/validate_installation.py release-dist

      - name: Record distribution hashes
        run: |
          mkdir checksums
          cd release-dist
          sha256sum *.whl *.tar.gz > ../checksums/SHA256SUMS

      - name: Upload the immutable release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-goblin-distributions
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
            checksums/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/proof-goblin
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download the validated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proof-goblin-distributions
          path: release-artifacts
          digest-mismatch: error

      - name: Verify distribution hashes
        working-directory: release-artifacts/release-dist
        run: sha256sum --check ../checksums/SHA256SUMS

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-artifacts/release-dist/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    if: >-
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      !github.event.release.draft
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proof-goblin
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download the validated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proof-goblin-distributions
          path: release-artifacts
          digest-mismatch: error

      - name: Verify distribution hashes
        working-directory: release-artifacts/release-dist
        run: sha256sum --check ../checksums/SHA256SUMS

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/release-dist/
          attestations: true
